<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لعبة الجملة الاسمية</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <button id="mute-btn">🔊</button>

  <!-- شاشة البداية -->
  <div id="start-screen" class="screen active">
    <img src="images/castle.png" class="bg-img">

    <div class="overlay">
      <h1>🏰 لعبة الجملة الاسمية</h1>

      <!-- اسم الطالب -->
      <input
        type="text"
        id="player-name"
        placeholder="اكتب اسمك الكامل"
        maxlength="50"
      >

      <img src="images/student.png" class="char-img">

      <button id="start-btn">ابدأ اللعبة</button>
    </div>
  </div>

  <!-- شاشة الأسئلة -->
  <div id="quiz-screen" class="screen">
    <img src="images/questions_bg.png" class="bg-img">

    <div class="overlay">
      <div id="score-box">
        النقاط: <span id="score">0</span>
      </div>

      <img src="images/book.png" class="small-icon">

      <img
        id="feedback-icon"
        class="feedback-icon"
      >

      <div id="question-container"></div>
    </div>
  </div>

  <!-- شاشة النهاية -->
  <div id="end-screen" class="screen">
    <img src="images/ending_bg.png" class="bg-img">

    <div class="overlay">

      <div class="end-icons">
        <img src="images/trophy.png" class="char-img">
        <img src="images/treasure.png" class="char-img">
      </div>

      <h1>انتهت اللعبة! 🎉</h1>

      <p id="final-score"></p>

      <!-- الشهادة واسم الطالب -->
      <div class="certificate-wrapper">
        <img
          src="images/certificate.png"
          class="cert-img"
        >

        <div id="certificate-name"></div>
      </div>

      <button id="restart-btn">
        إعادة اللعبة
      </button>

    </div>
  </div>

  <audio
    id="bg-music"
    src="sounds/background.mp3"
    loop
  ></audio>

  <audio
    id="correct-sound"
    src="sounds/correct.mp3"
  ></audio>

  <audio
    id="wrong-sound"
    src="sounds/wrong.mp3"
  ></audio>

<script src="script.js"></script>

</body>
</html>
