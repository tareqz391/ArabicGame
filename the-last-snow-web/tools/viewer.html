<!doctype html>
<html><head><meta charset="utf-8"><title>Model Viewer</title>
<style>html,body{margin:0;background:#0b1020;overflow:hidden}</style></head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
const q = new URLSearchParams(location.search);
const file = q.get('m') || 'train_car';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.toneMapping = THREE.ACESFilmicToneMapping; r.shadowMap.enabled = true;
document.body.appendChild(r.domElement);
const s = new THREE.Scene(); s.background = new THREE.Color(0x0b1020); s.fog = new THREE.FogExp2(0x0b1020, 0.02);
const cam = new THREE.PerspectiveCamera(+(q.get('fov')||40), innerWidth / innerHeight, 0.1, 500);
s.add(new THREE.HemisphereLight(0x8fa8d8, 0x1a1a22, 1.2));
const d = new THREE.DirectionalLight(0xbfd2ff, 2.0); d.position.set(-5, 10, 8); d.castShadow = true; s.add(d);
const warm = new THREE.PointLight(0xffb070, +(q.get('warm')||0), 12); warm.position.set(0, 2, 0); s.add(warm);
new GLTFLoader().load(`/public/models/${file}.glb`, g => {
  s.add(g.scene);
  g.scene.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } });
  const hide = q.get('hide'); if (hide) hide.split(',').forEach(n => { const o = g.scene.getObjectByName(n); if (o) o.visible = false; });
  const box = new THREE.Box3().setFromObject(g.scene); const c = box.getCenter(new THREE.Vector3()); const sz = box.getSize(new THREE.Vector3());
  const p = (q.get('cam')||'').split(',').map(Number);
  if (p.length === 6) { cam.position.set(p[0],p[1],p[2]); cam.lookAt(p[3],p[4],p[5]); }
  else { cam.position.set(c.x, c.y + sz.y * 0.3, c.z + Math.max(sz.x, sz.y) * 1.3); cam.lookAt(c); }
  if (g.animations.length && q.get('anim')) {
    const mixer = new THREE.AnimationMixer(g.scene); const clip = THREE.AnimationClip.findByName(g.animations, q.get('anim'));
    mixer.clipAction(clip).play(); mixer.setTime(+(q.get('t')||0.3));
  }
  window.__info = { names: [], anims: g.animations.map(a => a.name + ':' + a.duration.toFixed(2)) };
  g.scene.traverse(o => window.__info.names.push(o.name));
  r.render(s, cam); window.__ready = true;
});
</script></body></html>
